[package]
name = "tali"
description = "Count the number of lines, words, and bytes"
version = "0.2.0"
edition = "2024"
authors = ["Shresht7"]
license = "MIT"
homepage = "https://github.com/Shresht7/tali"
keywords = ["cli", "count", "loc", "lines-of-code", "tali"]
categories = ["command-line-utilities"]
exclude = [".github/*", ".vscode/*"]

[lib]
path = "src/lib/mod.rs"

[[bench]]
name = "scanner"
harness = false

[dependencies]
clap = { version = "4.5.28", features = ["derive"] }
globset = "0.4.16"
ignore = "0.4.23"
rayon = "1.10.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"
