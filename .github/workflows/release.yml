name: GitHub Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: $${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: tali
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: tali.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: tali

    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: cargo build --release

      - name: Generate Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/release/${{ matrix.binary }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.target }}
          path: target/release/${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages/linux packages/windows packages/macos release-assets
          cp artifacts/x86_64-unknown-linux-gnu/tali packages/linux/tali
          cp artifacts/x86_64-pc-windows-msvc/tali.exe packages/windows/tali.exe
          cp artifacts/x86_64-apple-darwin/tali packages/macos/tali
          for platform in linux windows macos; do
            cp README.md LICENSE "packages/$platform/"
          done
          tar -czf release-assets/tali-x86_64-unknown-linux-gnu.tar.gz \
            -C packages/linux tali README.md LICENSE
          zip -q -j release-assets/tali-x86_64-pc-windows-msvc.zip \
            packages/windows/tali.exe packages/windows/README.md packages/windows/LICENSE
          tar -czf release-assets/tali-x86_64-apple-darwin.tar.gz \
            -C packages/macos tali README.md LICENSE
          gh release create "${{ github.ref_name }}" \
            release-assets/tali-x86_64-unknown-linux-gnu.tar.gz \
            release-assets/tali-x86_64-pc-windows-msvc.zip \
            release-assets/tali-x86_64-apple-darwin.tar.gz \
            --generate-notes \
            --title "${{ github.ref_name }}"
